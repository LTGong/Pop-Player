<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14120f">
<title>Pop TV</title>
<style>
:root{--bg:#14120f;--ink:#fbf7ef;--dim:#cfc6b6;--ring:#ffd35a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:Roboto,"Amazon Ember","Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none}
#app{display:grid;grid-template-columns:minmax(0,62fr) minmax(0,38fr);height:100%;gap:14px;padding:14px}
#left{display:flex;flex-direction:column;gap:10px;justify-content:center}
#screen{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 250px);background:#000;border-radius:10px;overflow:hidden;margin:0 auto}
#yt,#yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#shield{position:absolute;inset:0;z-index:2}
#shield.ad{bottom:38%}
#shield.ad::after{content:'';position:absolute;top:100%;left:0;width:62%;height:61.3%}
#veil{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;flex-direction:column;
  gap:18px;background:rgba(10,9,8,.72);text-align:center;padding:20px;pointer-events:none}
#veil.on{display:flex}
#veil .big{font-size:clamp(28px,4.2vw,52px);font-weight:800;line-height:1.1}
#veil .small{font-size:clamp(18px,2.2vw,26px);color:var(--dim)}
#veil svg{width:clamp(70px,10vw,130px);height:auto}
#prog{height:8px;background:#2c2822;border-radius:4px;overflow:hidden}
#ver{position:fixed;left:6px;bottom:4px;font-size:13px;color:#8a8070;pointer-events:none;white-space:pre;z-index:9}
#prog i{display:block;height:100%;width:0;background:var(--dim);transition:width 1s linear}
#info{margin-top:2px}
#chname{font-size:clamp(22px,2.6vw,32px);font-weight:800;line-height:1.1}
#vtitle{font-size:clamp(16px,1.7vw,21px);color:var(--dim);line-height:1.25;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#controls{display:flex;gap:6px;align-items:stretch}
.ctl{flex:1;font:inherit;font-size:clamp(13px,1.3vw,17px);font-weight:700;color:var(--bg);background:var(--ink);border:0;border-radius:14px;
  padding:8px 4px 6px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ctl svg{width:clamp(30px,3.2vw,42px);height:auto;fill:currentColor}
.ctl:active{transform:scale(.96)}
.ctl.off{opacity:.3}
#pause{flex:1.3;background:var(--ring)}
#vol{flex:2.6;display:flex;gap:3px;background:#2c2822;border-radius:16px;padding:4px;margin-left:6px}
#vol .ctl{background:transparent;color:var(--dim);min-height:76px}
#vol .ctl.sel{background:var(--ink);color:var(--bg)}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow-y:auto;align-content:start;
  padding:4px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tile{font:inherit;color:#fff;border:0;border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;position:relative;height:max(128px,calc((100vh - 28px - 12px*(var(--rows,4) - 1) - 8px)/var(--rows,4)));box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);outline:5px solid transparent;outline-offset:-1px}
.tile svg{flex:none;width:clamp(48px,5.4vw,76px);height:auto;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:clamp(20px,2.3vw,30px);line-height:1.05;text-align:center;text-shadow:0 2px 3px rgba(0,0,0,.35)}
.tile.on{outline-color:var(--ring)}
.tile.on::after{content:"Playing";position:absolute;top:8px;right:8px;font-size:16px;font-weight:700;background:var(--ring);color:#14120f;border-radius:20px;padding:2px 12px}
.tile:active{transform:scale(.97)}
@media (orientation:portrait){
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  #screen{max-height:none}
  .tile{height:160px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app">
  <section id="left">
    <div id="screen">
      <div id="yt"></div>
      <div id="shield"></div>
      <div id="veil"><div class="big" id="vbig"></div><div class="small" id="vsmall"></div></div>
    </div>
    <div id="prog"><i></i></div><div id="ver">v11</div>
    <div id="info"><div id="chname">Pop TV</div><div id="vtitle">Getting ready…</div></div>
    <div id="controls">
      <button id="prev" class="ctl off" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h4v14H4zM21 5L10 12l11 7z"/></svg>Previous</button>
      <button id="back" class="ctl" type="button"><svg viewBox="0 0 24 24"><path d="M21 5l-9 7 9 7zM12 5l-9 7 9 7z"/></svg>Back 10</button>
      <button id="pause" class="ctl" type="button"><svg viewBox="0 0 24 24"><path id="pico" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg><span id="plab">Pause</span></button>
      <button id="fwd" class="ctl" type="button"><svg viewBox="0 0 24 24"><path d="M3 5l9 7-9 7zM12 5l9 7-9 7z"/></svg>Ahead 10</button>
      <button id="next" class="ctl off" type="button"><svg viewBox="0 0 24 24"><path d="M3 5l11 7-11 7zM16 5h4v14h-4z"/></svg>Next</button>
      <div id="vol">
        <button class="ctl" data-v="12" type="button"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/></svg>Quiet</button>
        <button class="ctl" data-v="40" type="button"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Normal</button>
        <button class="ctl" data-v="100" type="button"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Loud</button>
      </div>
    </div>
  </section>
  <nav id="grid"></nav>
</main>

<script>document.write('<script src="channels.js?'+Date.now()+'"><\/script>')</script>
<script>
{
const ICONS={
  logs:'<circle cx="24" cy="40" r="15"/><circle cx="24" cy="40" r="8"/><circle cx="24" cy="40" r="1.5"/><path d="M38 8l18 18M47 17L36 28a9 9 0 0 0 12 3"/>',
  gear:'<circle cx="32" cy="32" r="19" stroke-width="9" stroke-linecap="butt" stroke-dasharray="7.46 7.46"/><circle cx="32" cy="32" r="14"/><circle cx="32" cy="32" r="5"/>',
  train:'<path d="M6 46h52M10 46V28h22v18M32 34h18v12M38 34V24h8v10M14 28v-8h10v8M44 18q4-8 12-6"/><circle cx="17" cy="51" r="5"/><circle cx="40" cy="51" r="5"/><circle cx="52" cy="52" r="3"/>',
  plane:'<path d="M32 6v46M10 32l22-8 22 8M22 54l10-5 10 5M28 12a4 4 0 0 1 8 0"/>',
  can:'<ellipse cx="32" cy="14" rx="14" ry="5"/><path d="M18 14v36a14 5 0 0 0 28 0V14M28 12h8"/>',
  inn:'<path d="M14 20h26v30a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4zM40 26h7a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-7M14 20q1-9 13-7q12-2 13 7M22 30v16M32 30v16"/>',
  book:'<path d="M32 16c-6-5-15-6-24-5v36c9-1 18 0 24 5c6-5 15-6 24-5V11c-9-1-18 0-24 5zM32 16v36M14 21c4 0 9 1 12 3M14 29c4 0 9 1 12 3M38 24c3-2 8-3 12-3M38 32c3-2 8-3 12-3"/>',
  gramophone:'<rect x="8" y="44" width="30" height="12" rx="2"/><path d="M23 44v-8M23 36l10-6"/><path d="M30 31q12-6 16-22q12 10 8 26q-14 0-24-4z"/>',
  music:'<path d="M24 46V14l24-6v32"/><circle cx="18" cy="46" r="6"/><circle cx="42" cy="40" r="6"/>',
  news:'<rect x="8" y="12" width="40" height="40" rx="3"/><path d="M48 22h8v26a4 4 0 0 1-8 0M16 22h24M16 31h24M16 39h16"/>'
};
const PLAY='<svg viewBox="0 0 24 24" fill="#fbf7ef"><path d="M7 4l14 8-14 8z"/></svg>';
const CH=(window.POP_CHANNELS||[]).filter(c=>(c.videos&&c.videos.length)||(c.alsoFrom&&c.alsoFrom.length));
const EVERY=window.POP_TOPUP_EVERY||3;
const $=id=>document.getElementById(id);
const DEBUG=/debug/.test(location.search+location.hash);
const VER='v11';
/* Pick up new versions by itself: check every 15 minutes, reload between videos. */
let updateReady=false;
setInterval(()=>{fetch('index.html?'+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
  const m=t.match(/const VER='(v\d+)'/);if(m&&m[1]!==VER)updateReady=true}).catch(()=>{})},15*60000);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

let S={cur:0,ch:{}};
try{const s=JSON.parse(localStorage.getItem('popTV')||'null');if(s&&s.ch)S=s}catch(e){}
const save=()=>{try{localStorage.setItem('popTV',JSON.stringify(S))}catch(e){}};
if(!(S.cur<CH.length))S.cur=0;
const st=i=>S.ch[CH[i].name]||(S.ch[CH[i].name]={order:[],pos:0,since:0,pl:0,item:null,t:0});
const bad=new Set();

let realAdNow=false,watched=0,posT=0,watchKey='',player=null,ready=false,item=null,userPaused=false,everPlayed=false,adLikely=false,lastT=-1,lastMove=Date.now(),stuck=0,fails=0,loadedAt=0;

/* ---------- picking what to play ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextItem(i){
  const c=CH[i],s=st(i),vids=(c.videos||[]).filter(v=>!bad.has(v));
  const from=c.alsoFrom||[];
  if(from.length&&(!vids.length||s.since>=(c.topupEvery||EVERY))){
    s.since=0;
    const ch=from[Math.floor(Math.random()*from.length)];
    const list='UULF'+ch.slice(2);           // channel's full-length uploads, newest first, no Shorts
    if(!vids.length){const idx=s.pl||0;s.pl=(idx+1)%40;return{list,index:idx}}
    return{list,index:Math.floor(Math.random()*15)};
  }
  if(!vids.length)return null;
  if(s.pos>=s.order.length||!s.order.length){
    const last=s.order[s.order.length-1];
    s.order=shuffle(vids);
    if(s.order.length>1&&s.order[0]===last)s.order.push(s.order.shift());
    s.pos=0;
  }
  const id=s.order[s.pos++];s.since++;
  return bad.has(id)?nextItem(i):{id};
}
function play(it,start){
  if(ready&&adLikely){setAd(false);pending=[it,start];makePlayer();return}
  const key=it.id||(it.list+':'+it.index);
  if(key!==watchKey){watchKey=key;watched=0;$('next').classList.add('off')}
  posT=start||0;
  item=it;userPaused=false;setPauseLabel();stuck=0;unveil();setAd(false);lastT=-1;lastMove=Date.now();loadedAt=Date.now();
  const s=st(S.cur);s.item=it;s.t=start||0;save();
  $('vtitle').textContent='';
  if(!ready){pending=[it,start];return}
  if(it.id)player.loadVideoById({videoId:it.id,startSeconds:start||0});
  else player.loadPlaylist({list:it.list,listType:'playlist',index:it.index,startSeconds:start||0});
}
function pushHist(){
  if(!item)return;const s=st(S.cur);s.hist=(s.hist||[]).concat([{item:currentItem(),t:posT}]).slice(-15);$('prev').classList.remove('off');
}
function advance(){
  if(updateReady){remember();location.reload();return}
  pushHist();
  const it=nextItem(S.cur);
  if(it)return play(it,0);
  /* this channel has nothing playable: move on to the next one */
  tune((S.cur+1)%CH.length,true);
}
function tune(i,force){
  if(updateReady&&i!==S.cur){remember();S.cur=i;save();location.reload();return}
  if(i===S.cur&&!force){if(userPaused)resume();return}
  remember();
  S.cur=i;save();drawGrid();
  $('chname').textContent=CH[i].name;
  const s=st(i);
  $('prev').classList.toggle('off',!(s.hist&&s.hist.length));
  if(s.item&&!(s.item.id&&bad.has(s.item.id)))play(s.item,Math.max(0,(s.t||0)-3));
  else advance();
}
function remember(){            // uses the last known position of the video itself, never an ad's clock
  if(!item)return;
  const s=st(S.cur);s.item=currentItem();s.t=posT||0;save();
}
function currentItem(){
  if(item&&item.list){try{const i=player.getPlaylistIndex();if(i>=0)return{list:item.list,index:i}}catch(e){}}
  return item;
}

/* ---------- screen messages ---------- */
function veil(big,small,icon){
  $('vbig').innerHTML=(icon||'')+'<div>'+esc(big)+'</div>';
  $('vsmall').textContent=small||'';$('veil').classList.add('on');
}
const unveil=()=>$('veil').classList.remove('on');
function setAd(on){adLikely=on;$('shield').classList.toggle('ad',on)}
function resume(){userPaused=false;unveil();try{setPauseLabel()}catch(e){}try{bc&&bc.postMessage('playing-here')}catch(e){}try{player.playVideo()}catch(e){}}

function setPauseLabel(){
  $('plab').textContent=userPaused?'Play':'Pause';
  $('pico').setAttribute('d',userPaused?'M6 4l15 8-15 8z':'M6 4h4v16H6zM14 4h4v16h-4z');
}
function togglePause(){
  if(!ready)return;
  if(userPaused||!everPlayed){resume();return}
  try{player.pauseVideo()}catch(e){}
  remember();userPaused=true;setPauseLabel();
  veil('Paused','Tap to keep watching',PLAY);
}
$('shield').addEventListener('click',()=>{       // tapping the video pauses or plays, like YouTube
  if(!ready)return;
  if(adLikely&&!userPaused){if(!everPlayed)resume();return}
  togglePause();
});
const seek=d=>{if(!ready||realAdNow)return;try{const t=player.getCurrentTime()||0,dur=player.getDuration()||0;
  const to=Math.max(0,t+d);if(dur&&to>=dur-1)return;player.seekTo(to,true);lastT=to;posT=to;lastMove=Date.now()}catch(e){}};
$('back').addEventListener('click',()=>seek(-10));
$('fwd').addEventListener('click',()=>seek(10));
/* Next stays greyed out for the first 20 seconds of each video, so it can't become rapid flicking. */
const NEXT_AFTER=20;
$('next').addEventListener('click',()=>{if(ready&&watched>=NEXT_AFTER)advance()});
$('pause').addEventListener('click',togglePause);
$('prev').addEventListener('click',()=>{
  const s=st(S.cur);if(!ready||!s.hist||!s.hist.length)return;
  const h=s.hist.pop();save();$('prev').classList.toggle('off',!s.hist.length);
  play(h.item,Math.max(0,(h.t||0)-3));
});

/* ---------- volume ---------- */
if(![12,40,100].includes(S.vol))S.vol=40;
function setVol(v){S.vol=v;save();
  document.querySelectorAll('#vol .ctl').forEach(b=>b.classList.toggle('sel',+b.dataset.v===v));
  if(ready){try{player.unMute();player.setVolume(v)}catch(e){}}}
$('vol').addEventListener('click',e=>{const b=e.target.closest('.ctl');if(b)setVol(+b.dataset.v)});
setVol(S.vol);


/* ---------- channel tiles ---------- */
function drawGrid(){
  $('grid').innerHTML=CH.map((c,i)=>
    `<button class="tile${i===S.cur?' on':''}" data-i="${i}" type="button" style="background:${esc(c.color||'#444')}">
      <svg viewBox="0 0 64 64">${ICONS[c.icon]||ICONS.gear}</svg><b>${esc(c.name)}</b></button>`).join('');
}
$('grid').addEventListener('click',e=>{const b=e.target.closest('.tile');if(b)tune(+b.dataset.i)});

/* ---------- YouTube player ---------- */
/* One player only. Changing video mid-ad can leave the ad's sound running inside YouTube's
   player, so in that case the player is thrown away and rebuilt, which silences everything. */
let pending=null;
function makePlayer(){
  ready=false;
  if(player){try{player.destroy()}catch(e){}player=null}
  $('screen').querySelectorAll('iframe').forEach(f=>f.remove());
  if(!$('yt')){const d=document.createElement('div');d.id='yt';$('screen').prepend(d)}
  player=new YT.Player('yt',{
    width:'100%',height:'100%',
    playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,iv_load_policy:3,rel:0,playsinline:1,modestbranding:1,cc_load_policy:0},
    events:{
      onReady(){ready=true;if(pending){const[p,t]=pending;pending=null;play(p,t)}else tune(S.cur,true)},
      onStateChange(e){
        if(e.data===1){everPlayed=true;fails=0;if(!userPaused)unveil();try{player.unMute();player.setVolume(S.vol)}catch(x){}
          const d=player.getVideoData&&player.getVideoData();if(d&&d.title)$('vtitle').textContent=d.title}
        if(e.data===0){advance()}
      },
      onError(){
        fails++;
        if(item&&item.id)bad.add(item.id);
        if(fails>12){veil('One moment…','Pop TV is looking for something to play');fails=0;setTimeout(advance,30000);return}
        setTimeout(advance,600);
      }
    }
  });
}
window.onYouTubeIframeAPIReady=makePlayer;
function loadAPI(){const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)}
loadAPI();

/* ---------- watchdog: keeps things moving on its own ---------- */
setInterval(()=>{
  if(document.hidden)return;
  if(!navigator.onLine){veil('Waiting for the internet','The picture will come back by itself');return}
  if(!ready){
    if(Date.now()-loadedAt>45000&&Date.now()>startAt+45000)location.reload();
    return;
  }
  let t=0,state=-1;
  try{t=player.getCurrentTime()||0;state=player.getPlayerState()}catch(e){}
  const dur=(()=>{try{return player.getDuration()||0}catch(e){return 0}})();
  $('prog').firstChild.style.width=dur?Math.min(100,t/dur*100)+'%':'0';
  if(userPaused){lastMove=Date.now();return}
  /* During an ad YouTube reports "unstarted" while the clock (the ad's) runs. Open the Skip corner then. */
  const moving=Math.abs(t-lastT)>0.2;
  const realAd=(state===-1&&moving)||(state===1&&!moving&&everPlayed);
  const ad=realAd||state===-1||state===3||state===5;   // anything that isn't the video itself playing
  if(DEBUG)$('ver').textContent=VER+'  state '+state+'  t '+t.toFixed(1)+'  ad '+ad+'  paused '+userPaused+'  '+innerWidth+'x'+innerHeight+'\n'+navigator.userAgent;
  if(ad!==adLikely)setAd(ad);
  if(state===1&&!realAd){if(moving)watched+=Math.min(Math.abs(t-lastT),3);posT=t}
  $('next').classList.toggle('off',watched<NEXT_AFTER);
  realAdNow=realAd;$('back').classList.toggle('off',realAd);$('fwd').classList.toggle('off',realAd);
  if(realAd)$('prog').firstChild.style.width='0';
  if(moving){lastT=t;lastMove=Date.now();stuck=0;if(state===1||ad)unveil();
    remember();return}
  const idle=Date.now()-lastMove;
  if(!everPlayed&&idle>4000&&state!==3){veil('Tap here to start','',PLAY);return}  // tablet blocked autoplay with sound
  if(state===2&&idle>2000){resume();return}                          // paused by something other than Pop
  if(idle>(realAd?90000:25000)){                                                     // frozen: retry once, then move on
    lastMove=Date.now();stuck++;
    if(stuck===1&&item)play(item,posT);else advance();
  }
},2000);
const startAt=Date.now();
window.addEventListener('online',()=>{unveil();if(ready&&item)play(currentItem(),Math.max(0,posT-2));else location.reload()});
window.addEventListener('offline',()=>veil('Waiting for the internet','The picture will come back by itself'));
/* Only play while on screen, and only in one place at a time (no "ghost" audio from a hidden tab). */
let hiddenPaused=false;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){remember();if(ready&&!userPaused){try{player.pauseVideo()}catch(e){}hiddenPaused=true}}
  else if(hiddenPaused){hiddenPaused=false;resume()}
});
let bc=null;
try{bc=new BroadcastChannel('popTV');bc.onmessage=()=>{
  if(!ready)return;remember();try{player.pauseVideo()}catch(e){}
  userPaused=true;hiddenPaused=false;setPauseLabel();veil('Paused','Pop TV is open somewhere else. Tap to watch here.',PLAY)};
  bc.postMessage('playing-here')}catch(e){}
window.addEventListener('pagehide',remember);
window.__pop={get player(){return player},get state(){return{item,userPaused,everPlayed,adLikely,lastT,stuck}}};  // for debugging

document.documentElement.style.setProperty('--rows',Math.min(5,Math.max(3,Math.ceil(CH.length/2))));
$('ver').textContent=VER+'  loaded '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
drawGrid();
$('chname').textContent=CH.length?CH[S.cur].name:'No channels yet';
}
</script>
</body>
</html>
